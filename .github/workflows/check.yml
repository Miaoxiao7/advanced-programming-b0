name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: lint and test
    # 固定 22.04：ubuntu-latest 已升级到 26.04，setup-python 的 3.9 预编译包
    # 尚无该发行版版本，会在“Set up Python”一步直接失败（与代码无关）。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Static checks (course rules A1-A4)
        run: ruff check .

      - name: Format check (course rule A2)
        run: ruff format --check .

      - name: Unit tests with coverage
        run: |
          python -m coverage run --source=b0_stats -m unittest discover -s tests -v
          python -m coverage report -m
